; Ditala untuk lonjakan presensi: tiap request presensi ±10–20 ms, sehingga
; 64 worker × beberapa replika cukup untuk ribuan request/detik. Skalakan replika horizontal.
[www]
pm = dynamic
pm.max_children = 64
pm.start_servers = 16
pm.min_spare_servers = 8
pm.max_spare_servers = 32
pm.max_requests = 1000
request_terminate_timeout = 90
