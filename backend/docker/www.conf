; Jumlah worker diatur lewat env FPM_MAX_CHILDREN (default 64 di VPS; kecil di Render free 512 MB).
; pm = ondemand: worker dibuat saat ada request, hemat RAM saat sepi.
[www]
pm = ondemand
pm.max_children = ${FPM_MAX_CHILDREN}
pm.process_idle_timeout = 20s
pm.max_requests = 1000
request_terminate_timeout = 90
; Teruskan env container (APP_KEY, TRUSTED_PROXIES, dll.) ke PHP
clear_env = no
